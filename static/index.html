<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时选股系统</title>
<script src="/static/echarts.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #21262d; --text: #e6edf3;
    --muted: #8b949e; --up: #ef232a; --down: #14b143; --accent: #58a6ff;
    --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "Microsoft YaHei", sans-serif; }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin-right: 8px; }
  header .nav-link {
    margin-left: auto; padding: 4px 12px; border-radius: 12px; font-size: 12px;
    color: var(--accent); text-decoration: none; border: 1px solid var(--border);
  }
  header .nav-link:hover { border-color: var(--accent); background: rgba(88,166,255,.12); }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot-ok { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .dot-err { background: var(--up); box-shadow: 0 0 6px var(--up); }
  .dot-off { background: var(--muted); }
  .muted { color: var(--muted); }
  #statusMsg { color: var(--muted); }
  .strat-chip {
    padding: 3px 10px; border-radius: 12px; cursor: pointer; user-select: none;
    border: 1px solid var(--border); color: var(--muted); background: transparent;
    transition: all .15s;
  }
  .strat-chip.on { color: var(--accent); border-color: var(--accent); background: rgba(88,166,255,.12); }
  /* 两类信号分组：买入战法（收盘确认）与盘中异动（即时、会撤）用不同底色区分 */
  .strat-group { display: inline-flex; align-items: center; gap: 5px; margin-right: 14px; }
  .strat-group-label {
    font-size: 11px; color: var(--muted); opacity: .75;
    border-right: 1px solid var(--border); padding-right: 7px; cursor: help;
  }
  .strat-chip.k-buy.on { color: #7ee787; border-color: #7ee787; background: rgba(126,231,135,.12); }
  .strat-chip.k-alert.on { color: #d29922; border-color: #d29922; background: rgba(210,153,34,.12); }
  .add-box { display: flex; gap: 6px; margin-left: auto; }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 180px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); outline: none;
  }
  .suggest {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    max-height: 320px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0,0,0,.4);
    display: none;
  }
  .suggest .s-item {
    display: flex; gap: 10px; align-items: center; padding: 6px 10px;
    font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .suggest .s-item:hover, .suggest .s-item.on { background: #1c2330; }
  .suggest .s-code { color: var(--accent); }
  .suggest .s-src { margin-left: auto; color: var(--muted); font-size: 11px; }
  .suggest .s-empty { color: var(--muted); text-align: center; padding: 8px; }
  button {
    padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  main { display: flex; height: calc(100vh - 50px); }
  aside {
    width: 420px; min-width: 280px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--panel);
  }
  .divider-v {
    width: 4px; cursor: col-resize; flex-shrink: 0; background: var(--border);
    transition: background .15s;
  }
  .divider-v:hover, .divider-v.active { background: var(--accent); }
  .divider-h {
    height: 4px; cursor: row-resize; flex-shrink: 0; background: var(--border);
    transition: background .15s;
  }
  .divider-h:hover, .divider-h.active { background: var(--accent); }
  body.dragging { user-select: none; cursor: inherit; }
  body.dragging #chart { pointer-events: none; }
  .table-wrap { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; background: var(--panel); z-index: 2;
    text-align: right; padding: 6px 8px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  }
  th:first-child { text-align: left; }
  td { padding: 5px 8px; text-align: right; border-bottom: 1px solid #1a1f26; white-space: nowrap; }
  td:first-child { text-align: left; }
  tr { cursor: pointer; }
  tr:hover { background: #1c2330; }
  tr.sel { background: rgba(88,166,255,.14); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .badge {
    display: inline-block; padding: 1px 6px; margin-left: 3px; font-size: 11px;
    border-radius: 8px; border: 1px solid;
  }
  .b-ma { color: #d2a8ff; border-color: #d2a8ff; }
  .b-vol { color: #7ee787; border-color: #7ee787; }
  .b-up { color: var(--up); border-color: var(--up); }
  .b-pe { color: #79c0ff; border-color: #79c0ff; }
  .b-rsi { color: var(--warn); border-color: var(--warn); }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chart-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  #stockTitle { font-size: 15px; font-weight: 600; }
  #stockInfo { color: var(--muted); font-size: 12px; }
  .period-btn {
    padding: 2px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 12px;
  }
  .period-btn.on { color: var(--accent); border-color: var(--accent); background: rgba(88,166,255,.12); }
  #chart { flex: 1; min-height: 0; }
  .signals-panel {
    height: 230px; min-height: 120px; display: flex; flex-direction: column;
  }
  .signals-panel h3 { padding: 6px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--border); }
  #signalList { flex: 1; overflow-y: auto; }
  .panel-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .panel-tab {
    padding: 6px 16px; font-size: 13px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; user-select: none;
  }
  .panel-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .aside-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .aside-tab {
    padding: 6px 16px; font-size: 13px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; user-select: none;
  }
  .aside-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .star { color: var(--muted); cursor: pointer; }
  .star.on { color: var(--warn); }
  .scan-bar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 6px 12px; border-bottom: 1px solid #1a1f26;
  }
  .scan-bar select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 6px; outline: none;
  }
  #scanList { flex: 1; overflow-y: auto; }
  .scan-item {
    display: flex; gap: 10px; align-items: center; padding: 5px 12px;
    border-bottom: 1px solid #1a1f26; font-size: 12px; cursor: pointer;
  }
  .scan-item:hover { background: #1c2330; }
  .sig {
    display: flex; gap: 8px; align-items: center; padding: 4px 12px;
    border-bottom: 1px solid #1a1f26; font-size: 12px;
  }
  .sig.flash { background: rgba(210,168,255,.18); }
  .sig .code { color: var(--accent); cursor: pointer; }
  .sig .strat { color: #d2a8ff; }
  .sig .reason { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 信号筛选栏：按策略显隐实时信号（买入战法 / 盘中异动分组） */
  .signal-filter-bar {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 4px 12px; border-bottom: 1px solid var(--border);
  }
  .sig-filter-group { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
  .sig-filter-label {
    font-size: 11px; color: var(--muted); opacity: .75; cursor: pointer;
    border-right: 1px solid var(--border); padding-right: 6px; user-select: none;
  }
  .sig-filter-label:hover { color: var(--text); }
  .sig-chip {
    padding: 1px 8px; border-radius: 10px; cursor: pointer; user-select: none;
    border: 1px solid var(--border); color: var(--muted); background: transparent;
    font-size: 11px; transition: all .15s;
  }
  .sig-chip.on { color: #7ee787; border-color: #7ee787; background: rgba(126,231,135,.12); }
  .sig-chip.k-alert.on { color: #d29922; border-color: #d29922; background: rgba(210,153,34,.12); }
  /* 右键菜单（股票→加入组 / 组→改名删除） */
  .ctx-menu {
    position: fixed; z-index: 200; display: none; min-width: 140px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.5); padding: 4px 0;
  }
  .ctx-item { padding: 6px 14px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .ctx-item:hover { background: #1c2330; }
  .ctx-sep { height: 1px; background: var(--border); margin: 3px 0; }
  /* 内联弹窗（建组/改名/删除确认）：替代 prompt/confirm，沙盒 iframe 里原生弹窗会被禁用 */
  .modal-mask {
    position: fixed; inset: 0; z-index: 300; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.45);
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .modal-title { font-size: 14px; margin-bottom: 10px; }
  .modal-input {
    width: 100%; padding: 6px 8px; margin-bottom: 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-msg { font-size: 12px; color: var(--muted); margin-bottom: 10px; white-space: pre-line; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btns button.ok { background: rgba(88,166,255,.15); border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>📈 实时选股系统</h1>
  <span class="status-dot dot-off" id="connDot"></span>
  <span id="connText" class="muted">未连接</span>
  <span class="muted">|</span>
  <span id="tradingText" class="muted">--</span>
  <span class="muted">|</span>
  <span id="updateText" class="muted">--</span>
  <span class="muted">|</span>
  <span id="statusMsg">加载中…</span>
  <span id="stratBar" style="display:flex;gap:6px;flex-wrap:wrap;"></span>
  <div class="add-box">
    <div class="search-wrap">
      <input id="addCode" placeholder="代码/名称 如 600519、茅台" autocomplete="off" />
      <div id="suggestBox" class="suggest"></div>
    </div>
    <button onclick="addStock()">加股票池</button>
    <button onclick="addWatch()">☆ 加自选</button>
  </div>
  <a class="nav-link" href="/backtest" title="战法验证台：选战法/股票/时间范围，固定金额单笔验证">🧪 战法验证台</a>
</header>
<main>
  <aside>
    <div class="aside-tabs" id="asideTabs">
      <span class="aside-tab on" id="tabAll" onclick="setView('all')">📊 股票池<span id="poolCount"></span></span>
      <span class="aside-tab" id="tabWatch" onclick="setView('watch')">★ 自选<span id="watchCount"></span></span>
      <span class="aside-tab" id="tabAddGroup" onclick="promptAddGroup()" title="新建自定义组（右键股票可加入组）">＋</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:24px"></th><th data-k="code">代码</th><th data-k="name">名称</th>
            <th data-k="price" data-dir="-1">现价</th><th data-k="change_pct" data-dir="-1">涨跌%</th>
            <th data-k="volume_ratio" data-dir="-1">量比</th><th>信号</th>
          </tr>
        </thead>
        <tbody id="stockBody"></tbody>
      </table>
    </div>
  </aside>
  <div class="divider-v" id="vSplit" title="拖动调整宽度"></div>
  <section>
    <div class="chart-head">
      <span id="stockTitle">请选择股票</span>
      <span id="stockInfo"></span>
      <span style="flex:1"></span>
      <span class="period-btn on" data-p="daily" onclick="setPeriod('daily')">日K</span>
      <span class="period-btn" data-p="60m" onclick="setPeriod('60m')">60分</span>
      <span class="period-btn" data-p="30m" onclick="setPeriod('30m')">30分</span>
      <span class="period-btn" data-p="15m" onclick="setPeriod('15m')">15分</span>
      <span class="period-btn" data-p="5m" onclick="setPeriod('5m')">5分</span>
      <span class="period-btn" data-p="1m" onclick="setPeriod('1m')">1分</span>
    </div>
    <div id="chart"><div class="empty">左侧选择一只股票查看实时K线</div></div>
    <div class="divider-h" id="hSplit" title="拖动调整高度"></div>
    <div class="signals-panel">
      <div class="panel-tabs">
        <span class="panel-tab on" id="tabSignals" onclick="switchPanel('signals')">🛎 实时信号</span>
        <span class="panel-tab" id="tabScan" onclick="switchPanel('scan')">🔍 战法筛选</span>
      </div>
      <div id="signalPanel" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <div id="signalFilterBar" class="signal-filter-bar"></div>
        <div id="signalList"></div>
      </div>
      <div id="scanPanel" style="display:none;flex:1;flex-direction:column;min-height:0">
        <div class="scan-bar">
          <select id="scanRule" title="买入规则（含 user_rules 自定义战法）"></select>
          <select id="scanMode" title="盘中异动=判定当日末根（进行中，即时会撤）；买入战法=判定当日最后一根已收盘K线（与回测逐根一致）">
            <option value="live" selected>盘中异动</option>
            <option value="close">买入战法</option>
          </select>
          <select id="scanPeriod">
            <option value="30m" selected>30分</option>
            <option value="60m">60分</option>
            <option value="15m">15分</option>
            <option value="5m">5分</option>
            <option value="daily">日K</option>
          </select>
          <select id="scanDay">
            <option value="today" selected>今天</option>
            <option value="latest">最近交易日</option>
            <option value="prev">前一天</option>
          </select>
          <select id="scanScope" title="扫描范围：股票池/自选/自定义分组">
            <option value="pool" selected>股票池</option>
            <option value="watch">自选</option>
          </select>
          <button onclick="runScan()">查询</button>
          <span id="scanMsg" class="muted"></span>
        </div>
        <div id="scanList"></div>
      </div>
    </div>
  </section>
</main>
<div id="ctxMenu" class="ctx-menu"></div>
<div id="modalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <input id="modalInput" class="modal-input" style="display:none" />
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-btns">
      <button id="modalCancel">取消</button>
      <button id="modalOk" class="ok">确定</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// 全局状态
// ---------------------------------------------------------------------------
const PERIOD_LABEL = { daily: "日K", "60m": "60分", "30m": "30分", "15m": "15分", "5m": "5分", "1m": "1分" };
// 信号类别：buy=买入战法（收盘确认，与回测一致）/ alert=盘中异动（即时，会撤）
// 颜色与 badge 按类别给，不再逐个策略 key 硬编码——实时信号现在全由
// config.REALTIME_RULE_SIGNALS 动态注册，写死 key 必然过时
const KIND_LABEL = { buy: "买入", alert: "异动" };
const KIND_COLOR = { buy: "#7ee787", alert: "#d29922" };
const KIND_BADGE = { buy: "b-ma", alert: "b-up" };
function stratKind(key) { return (stratDefs[key] || {}).kind || ""; }
function stratColor(key) { return KIND_COLOR[stratKind(key)] || "#d2a8ff"; }
// 信号标题：「买入·KDJ+RSI双金叉共振 30m」/「异动·涨停预警」
// 已删策略的历史信号查不到 kind，退化成只显示名字
function stratTitle(key, fallbackName) {
  const d = stratDefs[key] || {};
  const name = d.name || fallbackName || key;
  const label = KIND_LABEL[d.kind];
  if (!label) return name;
  const per = d.kind === "buy" && d.period ? " " + (PERIOD_LABEL[d.period] || d.period) : "";
  return label + "·" + name + per;
}

let snapshots = {};        // code -> snapshot
let signalMap = {};        // code -> {key: {name, ts}}
let selectedCode = null;
let currentPeriod = "daily";
let chart = null;
let klineTimer = null;
let chartKey = null;
let sortedKey = "change_pct", sortedDir = -1;
let stratDefs = {};        // key -> {name, enabled}
let watchSet = new Set();  // 自选股代码集合
let customGroups = [];     // 自定义分组 [{id, name, stocks:[{code,name}]}]
let viewMode = "all";      // all=股票池 watch=仅自选 group:{id}=某自定义组
let signalFilter = {};     // 信号筛选：key -> 是否显示（缺省=显示）
let lastScanData = null;   // 最近一次扫描结果（供筛选面板本地重筛）

const $ = id => document.getElementById(id);

// ---------------------------------------------------------------------------
// 信号筛选（信号面板顶部：按策略显隐实时信号，默认全部显示）
// ---------------------------------------------------------------------------
function buildSignalFilters(strats) {
  const bar = $("signalFilterBar");
  const old = signalFilter;
  signalFilter = {};    // 重建：新策略默认显示，旧的选中状态保留
  strats.forEach(s => { signalFilter[s.key] = old[s.key] !== false; });
  bar.innerHTML = "";
  const groups = [
    { kind: "buy", label: "买入战法" },
    { kind: "alert", label: "盘中异动" },
  ];
  groups.forEach(g => {
    const items = strats.filter(s => (s.kind || "buy") === g.kind);
    if (!items.length) return;
    const wrap = document.createElement("span");
    wrap.className = "sig-filter-group";
    const lab = document.createElement("span");
    lab.className = "sig-filter-label";
    lab.textContent = g.label;
    lab.title = "点击：整组信号显示/隐藏";
    lab.onclick = () => toggleSignalGroup(g.kind);
    wrap.appendChild(lab);
    items.forEach(s => {
      const chip = document.createElement("span");
      const cls = () => "sig-chip k-" + g.kind + (signalFilter[s.key] ? " on" : "");
      chip.className = cls();
      chip.textContent = s.name + (g.kind === "buy" && s.period
        ? " " + (PERIOD_LABEL[s.period] || s.period) : "");
      chip.title = "点击：只显示/隐藏该策略的实时信号（不影响策略开关）";
      chip.onclick = () => {
        signalFilter[s.key] = !signalFilter[s.key];
        chip.className = cls();
        applySignalFilter();
      };
      wrap.appendChild(chip);
    });
    bar.appendChild(wrap);
  });
  if (!strats.length) bar.innerHTML = "";
}

function toggleSignalGroup(kind) {
  // 整组反转：全部可见 → 全部隐藏，否则 → 全部显示
  const keys = Object.keys(stratDefs).filter(k => stratDefs[k].kind === kind);
  const allOn = keys.every(k => signalFilter[k] !== false);
  keys.forEach(k => { signalFilter[k] = !allOn; });
  buildSignalFilters(Object.values(stratDefs));   // 重建样式；顺序保持
  applySignalFilter();
}

function applySignalFilter() {
  // 已显示的信号条目按筛选显隐；表格 badge 与图表标记同步
  [...$("signalList").children].forEach(el => {
    const k = el.dataset.strategy;
    el.style.display = signalFilter[k] === false ? "none" : "";
  });
  renderTable();
  if (lastKlines.length) renderChart(lastKlines, currentSigs);
}

// ---------------------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------------------
let ws = null;
function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("connDot").className = "status-dot dot-ok"; $("connText").textContent = "已连接"; };
  ws.onclose = () => { $("connDot").className = "status-dot dot-err"; $("connText").textContent = "已断开，重连中…"; setTimeout(connectWS, 5000); };
  ws.onerror = () => ws.close();
  ws.onmessage = ev => handleMsg(JSON.parse(ev.data));
}

function handleMsg(msg) {
  const d = msg.data || {};
  switch (msg.type) {
    case "snapshots":
      snapshots = {};
      (d.snapshots || []).forEach(s => { snapshots[s.code] = s; });
      updateHits(d.hits || []);
      renderTable();
      updateChartTail();
      $("updateText").textContent = `更新 ${timeStr(d.ts)}`;
      break;
    case "signal":
      addSignal(d, true);
      // 记录持有中的信号（K线类保留30分钟，快照类由 hits 维护）
      const sig = signalMap[d.code] || (signalMap[d.code] = {});
      sig[d.strategy] = { name: d.strategy_name, ts: Date.now(),
        kind: stratKind(d.strategy) === "alert" ? "snap" : "kline" };
      renderTable();
      if (selectedCode === d.code) {
        // 即时标注：直接注入信号并重绘，不等 /api/kline、/api/signals 往返
        currentSigs.unshift({ ts: d.ts, code: d.code, name: d.name, strategy: d.strategy,
          price: d.price, change_pct: d.change_pct, reason: d.reason });
        if (lastKlines.length) renderChart(lastKlines, currentSigs);
        refreshKline();
      }
      break;
    case "signals_history":
      (d.signals || []).slice().reverse().forEach(s => addSignal({
        ts: s.ts, code: s.code, name: s.name, strategy_name: strategyName(s.strategy),
        strategy: s.strategy, price: s.price, change_pct: s.change_pct, reason: s.reason
      }, false));
      break;
    case "status":
      if (d.msg) $("statusMsg").textContent = d.msg;
      if (d.strategies) { buildStratBar(d.strategies); buildSignalFilters(d.strategies); }
      if (d.pool_size) $("poolCount").textContent = `(${d.pool_size})`;
      $("tradingText").textContent = d.trading ? "盘中" : "休市/盘外";
      break;
  }
}

function strategyName(key) {
  return (stratDefs[key] && stratDefs[key].name) || key;
}

function buildStratBar(strats) {
  stratDefs = {};
  strats.forEach(s => { stratDefs[s.key] = s; });
  const bar = $("stratBar");
  bar.innerHTML = "";
  // 分两组：买入战法（收盘确认、与回测逐根一致）/ 盘中异动（判定进行中K线、会撤）
  const groups = [
    { kind: "buy", label: "买入战法", hint: "收盘确认，与验证台回测逐根一致，报了不撤" },
    { kind: "alert", label: "盘中异动", hint: "判定进行中K线，即时但可能撤销，仅作提醒" },
  ];
  groups.forEach(g => {
    const items = strats.filter(s => (s.kind || "buy") === g.kind);
    if (!items.length) return;
    const wrap = document.createElement("span");
    wrap.className = "strat-group";
    const lab = document.createElement("span");
    lab.className = "strat-group-label";
    lab.textContent = g.label;
    lab.title = g.hint;
    wrap.appendChild(lab);
    items.forEach(s => {
      const chip = document.createElement("span");
      const cls = () => "strat-chip k-" + g.kind + (s.enabled ? " on" : "");
      chip.className = cls();
      chip.textContent = s.name + (g.kind === "buy" && s.period
        ? " " + (PERIOD_LABEL[s.period] || s.period) : "");
      chip.title = [g.hint, s.rule ? "规则: " + s.rule : "", s.desc]
        .filter(Boolean).join("\n");
      chip.onclick = async () => {
        s.enabled = !s.enabled;
        chip.className = cls();
        await fetch("/api/strategies/toggle", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: s.key, enabled: s.enabled }) });
      };
      wrap.appendChild(chip);
    });
    bar.appendChild(wrap);
  });
}

function renderTable() {
  const body = $("stockBody");
  let list = Object.values(snapshots);
  let currentGroup = viewMode.startsWith("group:")
    ? customGroups.find(g => "group:" + g.id === viewMode) : null;
  if (viewMode === "watch") list = list.filter(s => watchSet.has(s.code));
  else if (currentGroup) {
    const codes = new Set(currentGroup.stocks.map(s => s.code));
    list = list.filter(s => codes.has(s.code));
  }
  list.sort((a, b) => {
    let va = a[sortedKey], vb = b[sortedKey];
    if (va == null) va = -1e9; if (vb == null) vb = -1e9;
    return (va - vb) * sortedDir;
  });
  body.innerHTML = "";
  if (!list.length) {
    const hint = viewMode === "watch"
      ? "暂无自选股：在顶部输入代码，点“☆ 加自选”添加"
      : currentGroup
        ? `「${currentGroup.name}」暂无股票：在任意股票上点右键 → 选择本组加入`
        : "暂无数据";
    body.innerHTML = `<tr><td colspan="7" class="empty">${hint}</td></tr>`;
    return;
  }
  list.forEach(s => {
    const tr = document.createElement("tr");
    if (s.code === selectedCode) tr.className = "sel";
    const pct = s.change_pct || 0;
    const cls = pct > 0 ? "up" : pct < 0 ? "down" : "flat";
    const watched = watchSet.has(s.code);
    const badges = Object.entries(signalMap[s.code] || {})
      .filter(([k]) => signalFilter[k] !== false)   // 信号筛选：隐藏的策略不出 badge
      .map(([k, v]) => `<span class="badge ${KIND_BADGE[stratKind(k)] || 'b-ma'}">${v.name}</span>`).join("");
    const first = currentGroup
      ? `<td style="text-align:center" class="star" title="移出「${currentGroup.name}」">✕</td>`
      : `<td style="text-align:center" class="star${watched ? ' on' : ''}" title="${watched ? '移出自选' : '加入自选'}">${watched ? '★' : '☆'}</td>`;
    tr.innerHTML =
      first +
      `<td>${s.code}</td><td>${s.name}</td>` +
      `<td class="${cls}">${fmt(s.price, 2)}</td>` +
      `<td class="${cls}">${pct > 0 ? '+' : ''}${pct.toFixed(2)}%</td>` +
      `<td>${fmt(s.volume_ratio, 2)}</td>` +
      `<td style="text-align:left">${badges}</td>`;
    tr.cells[0].onclick = e => {
      e.stopPropagation();
      currentGroup ? removeGroupStock(currentGroup.id, s.code) : toggleWatch(s.code);
    };
    tr.onclick = () => selectStock(s.code);
    tr.oncontextmenu = ev => {
      ev.preventDefault();
      showStockCtxMenu(ev.clientX, ev.clientY, s.code);
    };
    body.appendChild(tr);
  });
}

function updateHits(hits) {
  const now = Date.now();
  // 命中项的策略字段名是 key（scanner 广播 {"code","name", **hit}，hit 里是 key）。
  // 这里原本读 h.strategy，恒为 undefined，导致快照类 badge 的保活判断一直失效
  const hitNow = new Set(hits.map(h => `${h.code}:${h.key}`));
  for (const code in signalMap) {
    for (const key in signalMap[code]) {
      const v = signalMap[code][key];
      const isSnap = stratKind(key) === "alert";
      const present = hitNow.has(`${code}:${key}`);
      const ttl = isSnap ? 90 * 1000 : 30 * 60 * 1000;
      if (isSnap && !present && now - v.ts > 60 * 1000) delete signalMap[code][key];
      if (now - v.ts > ttl) delete signalMap[code][key];
    }
    if (!Object.keys(signalMap[code]).length) delete signalMap[code];
  }
}

// MA / MACD 计算（与后端一致）
function calcMA(arr, n) {
  const out = new Array(arr.length).fill(null);
  if (arr.length < n) return out;
  let s = 0;
  for (let i = 0; i < n; i++) s += arr[i];
  out[n - 1] = s / n;
  for (let i = n; i < arr.length; i++) { s += arr[i] - arr[i - n]; out[i] = s / n; }
  return out;
}
function calcEMA(arr, n) {
  const out = []; if (!arr.length) return out;
  let prev = arr[0], k = 2 / (n + 1); out.push(prev);
  for (let i = 1; i < arr.length; i++) { prev = arr[i] * k + prev * (1 - k); out.push(prev); }
  return out;
}
function calcMACD(closes) {
  const ef = calcEMA(closes, 12), es = calcEMA(closes, 26);
  const dif = closes.map((_, i) => ef[i] - es[i]);
  const dea = calcEMA(dif, 9);
  const hist = dif.map((d, i) => 2 * (d - dea[i]));
  return { dif, dea, hist };
}

let lastKlines = [];       // 当前图表K线数据（信号推送时用于即时重绘，不等网络请求）
let currentSigs = [];      // 当前股票的信号列表

// 信号 → K线索引匹配：优先从 reason 提取实际K线时间（如"@2026-08-10"），
// 否则用信号触发时间；日K按日期，分钟K按时间区间（K线ts为结束时间）
function buildSignalMarks(klines, sigs) {
  const marks = [];
  const stacked = {};   // 同一根K线多个信号时横向错开
  sigs.forEach(s => {
    if (signalFilter[s.strategy] === false) return;   // 信号筛选：隐藏的策略不标注
    const rm = (s.reason || "").match(/(\d{4}-\d{2}-\d{2})(?: (\d{2}:\d{2}))?/);
    const sigDay = rm ? rm[1] : s.ts.slice(0, 10);
    const sigTime = rm ? rm[2] || null : s.ts.slice(11, 16);
    let idx = -1;
    if (currentPeriod === "daily") {
      idx = klines.findIndex(k => k.ts.slice(0, 10) === sigDay);
    } else if (sigTime) {
      for (let i = 0; i < klines.length; i++) {
        if (klines[i].ts.slice(0, 10) !== sigDay) continue;
        if (klines[i].ts.slice(11, 16) >= sigTime) { idx = i; break; }
      }
      if (idx < 0) { // 盘后触发的信号归到当日最后一根
        for (let i = klines.length - 1; i >= 0; i--) {
          if (klines[i].ts.slice(0, 10) === sigDay) { idx = i; break; }
        }
      }
    } else {
      // 日K类策略信号在分钟图查看 → 归到对应交易日最后一根
      for (let i = klines.length - 1; i >= 0; i--) {
        if (klines[i].ts.slice(0, 10) === sigDay) { idx = i; break; }
      }
    }
    if (idx < 0) return;
    const off = (stacked[idx] || 0) * 20;
    stacked[idx] = (stacked[idx] || 0) + 1;
    marks.push({
      coord: [idx, klines[idx].high],
      symbolOffset: [off, 0],
      short: strategyName(s.strategy).slice(0, 2),
      itemStyle: { color: stratColor(s.strategy) },
      sig: s,
    });
  });
  return marks;
}

function renderChart(klines, sigs) {
  if (!klines || !klines.length) return;
  lastKlines = klines;
  currentSigs = sigs || [];
  if (!chart) chart = echarts.init($("chart"));
  const dates = klines.map(k => k.ts);
  const kdata = klines.map(k => [k.open, k.close, k.low, k.high]);
  const vols = klines.map(k => k.volume);
  const closes = klines.map(k => k.close);
  const ma5 = calcMA(closes, 5), ma10 = calcMA(closes, 10), ma20 = calcMA(closes, 20), ma60 = calcMA(closes, 60);
  const { dif, dea, hist } = calcMACD(closes);

  const n = klines.length, show = Math.min(n, 140);
  let startPct = Math.max(0, 100 - show / n * 100);
  let endPct = 100;
  const key = selectedCode + ":" + currentPeriod;
  if (chartKey === key && chart.getOption().dataZoom) {
    // 同股票同周期定时刷新：用户若缩放到历史区域则保留视图，否则跟随最新
    const dz = chart.getOption().dataZoom[0];
    if (dz.end < 99) { startPct = dz.start; endPct = dz.end; }
  }
  chartKey = key;
  const upColor = "#ef232a", dnColor = "#14b143";
  const volColors = vols.map((v, i) => closes[i] >= klines[i].open ? upColor : dnColor);
  const histColors = hist.map(v => v >= 0 ? upColor : dnColor);
  const grid = (top, h) => ({ left: 56, right: 16, top, height: h });

  chart.setOption({
    animation: false,
    backgroundColor: "#0d1117",
    axisPointer: { link: [{ xAxisIndex: "all" }], label: { backgroundColor: "#30363d" } },
    tooltip: { trigger: "axis", axisPointer: { type: "cross" },
      backgroundColor: "#161b22", borderColor: "#30363d", textStyle: { color: "#e6edf3", fontSize: 12 } },
    legend: { data: ["K线", "MA5", "MA10", "MA20", "MA60"], top: 2, textStyle: { color: "#8b949e", fontSize: 11 } },
    grid: [grid(30, "52%"), grid("66%", "13%"), grid("83%", "14%")],
    xAxis: [
      { type: "category", data: dates, gridIndex: 0, boundaryGap: true,
        axisLine: { lineStyle: { color: "#30363d" } }, axisLabel: { color: "#8b949e", fontSize: 10 } },
      { type: "category", data: dates, gridIndex: 1, axisLabel: { show: false }, axisLine: { lineStyle: { color: "#30363d" } } },
      { type: "category", data: dates, gridIndex: 2, axisLabel: { show: false }, axisLine: { lineStyle: { color: "#30363d" } } },
    ],
    yAxis: [
      { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: "#1c2128" } }, axisLabel: { color: "#8b949e", fontSize: 10 } },
      { scale: true, gridIndex: 1, splitLine: { show: false }, axisLabel: { color: "#8b949e", fontSize: 10 } },
      { scale: true, gridIndex: 2, splitLine: { lineStyle: { color: "#1c2128" } }, axisLabel: { color: "#8b949e", fontSize: 10 } },
    ],
    dataZoom: [
      { type: "inside", xAxisIndex: [0, 1, 2], start: startPct, end: endPct },
      { type: "slider", xAxisIndex: [0, 1, 2], start: startPct, end: endPct, bottom: 2, height: 16,
        borderColor: "#30363d", backgroundColor: "#161b22", fillerColor: "rgba(88,166,255,.15)" },
    ],
    series: [
      { name: "K线", type: "candlestick", data: kdata,
        itemStyle: { color: upColor, color0: dnColor, borderColor: upColor, borderColor0: dnColor },
        markPoint: {
          symbol: "pin", symbolSize: 32,
          label: { show: true, fontSize: 9, color: "#fff", formatter: p => p.data.short },
          tooltip: {
            backgroundColor: "#161b22", borderColor: "#30363d",
            textStyle: { color: "#e6edf3", fontSize: 12 },
            formatter: p => {
              const s = p.data.sig;
              const pct = s.change_pct || 0;
              return `<b style="color:${stratColor(s.strategy)}">${stratTitle(s.strategy)}</b><br/>`
                + `${s.code} ${s.name || ''} · ${s.ts}<br/>`
                + `价格 ${fmt(s.price, 2)} · ${pct > 0 ? '+' : ''}${pct.toFixed(2)}%<br/>`
                + `${s.reason || ''}`;
            },
          },
          data: buildSignalMarks(klines, sigs || []),
        },
      },
      { name: "MA5", type: "line", data: ma5, symbol: "none", lineStyle: { width: 1, color: "#f7b731" } },
      { name: "MA10", type: "line", data: ma10, symbol: "none", lineStyle: { width: 1, color: "#58a6ff" } },
      { name: "MA20", type: "line", data: ma20, symbol: "none", lineStyle: { width: 1, color: "#d2a8ff" } },
      { name: "MA60", type: "line", data: ma60, symbol: "none", lineStyle: { width: 1, color: "#3fb950" } },
      { name: "成交量", type: "bar", xAxisIndex: 1, yAxisIndex: 1, data: vols,
        itemStyle: { color: p => volColors[p.dataIndex] } },
      { name: "DIF", type: "line", xAxisIndex: 2, yAxisIndex: 2, data: dif, symbol: "none", lineStyle: { width: 1, color: "#f7b731" } },
      { name: "DEA", type: "line", xAxisIndex: 2, yAxisIndex: 2, data: dea, symbol: "none", lineStyle: { width: 1, color: "#58a6ff" } },
      { name: "MACD", type: "bar", xAxisIndex: 2, yAxisIndex: 2, data: hist,
        itemStyle: { color: p => histColors[p.dataIndex] } },
    ],
  }, true);
}

function addSignal(s, flash) {
  const list = $("signalList");
  const div = document.createElement("div");
  div.className = "sig" + (flash ? " flash" : "");
  div.dataset.strategy = s.strategy;
  if (signalFilter[s.strategy] === false) div.style.display = "none";
  const pct = s.change_pct || 0;
  div.innerHTML =
    `<span class="code" data-code="${s.code}" title="点击查看K线">${s.code}</span>` +
    `<span>${s.name || ''}</span>` +
    `<span class="strat">${stratTitle(s.strategy, s.strategy_name)}</span>` +
    `<span class="${pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat'}">${pct > 0 ? '+' : ''}${pct.toFixed(2)}%</span>` +
    `<span class="reason">${s.reason || ''}</span>` +
    `<span class="muted" style="margin-left:auto">${s.ts}</span>`;
  div.querySelector(".code").onclick = () => selectStock(s.code);
  list.prepend(div);
  while (list.children.length > 200) list.removeChild(list.lastChild);
  if (flash) setTimeout(() => div.classList.remove("flash"), 6000);
}

function switchPanel(which) {
  $("tabSignals").className = "panel-tab" + (which === "signals" ? " on" : "");
  $("tabScan").className = "panel-tab" + (which === "scan" ? " on" : "");
  $("signalPanel").style.display = which === "signals" ? "flex" : "none";
  $("scanPanel").style.display = which === "scan" ? "flex" : "none";
  if (which === "scan" && !$("scanRule").options.length) initScanRules();
}

async function initScanRules() {
  try {
    const r = await fetch("/api/backtest/rules");
    const d = await r.json();
    const sel = $("scanRule");
    (d.buy_rules || []).forEach(p => {
      const o = document.createElement("option");
      o.value = p.key; o.textContent = p.name; o.title = p.desc;
      sel.appendChild(o);
    });
  } catch (e) { /* 忽略 */ }
  refreshScanScopes();
}

function refreshScanScopes() {
  // 扫描范围：股票池/自选 + 每个自定义组一项（value=group-{id}），保持当前选择
  const sel = $("scanScope");
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = "";
  [["pool", "股票池"], ["watch", "自选"]].forEach(([v, t]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = t;
    sel.appendChild(o);
  });
  customGroups.forEach(g => {
    const o = document.createElement("option");
    o.value = "group-" + g.id; o.textContent = "📁 " + g.name;
    sel.appendChild(o);
  });
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

async function runScan() {
  $("scanMsg").textContent = "查询中…";
  $("scanList").innerHTML = "";
  const scopeVal = $("scanScope").value;
  const params = new URLSearchParams({
    rule: $("scanRule").value,
    period: $("scanPeriod").value,
    mode: $("scanMode").value,
    day: $("scanDay").value,
    scope: scopeVal.startsWith("group-") ? "group" : scopeVal,
  });
  if (scopeVal.startsWith("group-")) params.set("group_id", scopeVal.slice(6));
  try {
    const r = await fetch("/api/scan-rules?" + params);
    renderScan(await r.json());
  } catch (e) { $("scanMsg").textContent = "查询失败"; }
}

function renderScan(d) {
  lastScanData = d;
  drawScanList(d);
}

function drawScanList(d) {
  const list = $("scanList");
  list.innerHTML = "";
  if (d.ok === false) { $("scanMsg").textContent = d.msg || "查询失败"; return; }
  const scopeTxt = d.scope === "watch" ? "自选" : d.scope === "group"
    ? (customGroups.find(g => g.id === d.group_id) || {}).name || "自定义组"
    : "股票池";
  const modeTxt = d.mode === "close" ? "买入战法" : "盘中异动";
  if (!d.matches || !d.matches.length) {
    $("scanMsg").textContent = d.msg
      || `${d.date || "该日"} ${scopeTxt}·${modeTxt} 未找到触发「${d.rule_name}」的股票`;
    return;
  }
  $("scanMsg").textContent =
    `${d.date} ${scopeTxt}·${modeTxt}「${d.rule_name}」命中 ${d.matches.length} 只 · ` +
    `扫描 ${d.scanned} 只(取到 ${d.fetched}) · ${d.elapsed_ms}ms`;
  d.matches.forEach(m => {
    const div = document.createElement("div");
    div.className = "scan-item";
    const pct = m.change_pct || 0;
    div.innerHTML =
      `<span style="color:var(--accent)">${m.code}</span>` +
      `<span>${m.name || ''}</span>` +
      `<span>${fmt(m.price, 2)}</span>` +
      `<span class="${pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat'}">${pct > 0 ? '+' : ''}${pct.toFixed(2)}%</span>` +
      `<span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.reason || ''}</span>`;
    div.title = `${m.reason || ''} @ ${m.ts || ''}`;
    div.onclick = () => {
      selectedCode = m.code;
      if (currentPeriod !== d.period) {
        currentPeriod = d.period;
        chartKey = null;
        document.querySelectorAll(".period-btn").forEach(b =>
          b.className = "period-btn" + (b.dataset.p === d.period ? " on" : ""));
      }
      renderTable();
      refreshKline();
    };
    list.appendChild(div);
  });
}

// ---------------------------------------------------------------------------
// 自选股 / 自定义分组
// ---------------------------------------------------------------------------
function setView(mode) {
  viewMode = mode;
  $("tabAll").className = "aside-tab" + (mode === "all" ? " on" : "");
  $("tabWatch").className = "aside-tab" + (mode === "watch" ? " on" : "");
  renderGroupTabs();   // 重建组 tab（也负责 on 态与改名同步）
  renderTable();
}

function refreshWatchCount() {
  $("watchCount").textContent = watchSet.size ? `(${watchSet.size})` : "";
}

async function loadWatch() {
  try {
    const [r, rp, rg] = await Promise.all([
      fetch("/api/watch"), fetch("/api/pool"), fetch("/api/custom/groups")]);
    const d = await r.json();
    watchSet = new Set((d.watch || []).map(w => w.code));
    refreshWatchCount();
    const gd = await rg.json();
    customGroups = gd.groups || [];
    renderGroupTabs();
    refreshScanScopes();
    const pd = await rp.json();
    $("poolCount").textContent = `(${(pd.stocks || []).length})`;
    renderTable();
  } catch (e) { /* 忽略 */ }
}

// ------------------------- 分组：建组/改名/删除/加入 -------------------------

async function loadGroups() {
  try {
    const r = await fetch("/api/custom/groups");
    const d = await r.json();
    customGroups = d.groups || [];
    renderGroupTabs();
    refreshScanScopes();
    renderTable();
  } catch (e) { /* 忽略 */ }
}

function renderGroupTabs() {
  document.querySelectorAll(".aside-tab.group-tab").forEach(el => el.remove());
  const addBtn = $("tabAddGroup");
  customGroups.forEach(g => {
    const tab = document.createElement("span");
    tab.className = "aside-tab group-tab" + (viewMode === "group:" + g.id ? " on" : "");
    tab.textContent = "📁 " + g.name + (g.stocks.length ? `(${g.stocks.length})` : "");
    tab.title = `「${g.name}」${g.stocks.length} 只；右键可改名/删除`;
    tab.onclick = () => setView("group:" + g.id);
    tab.oncontextmenu = ev => {
      ev.preventDefault();
      showGroupCtxMenu(ev.clientX, ev.clientY, g.id, g.name);
    };
    addBtn.parentNode.insertBefore(tab, addBtn);
  });
}

async function promptAddGroup(afterCode) {
  showModal({ title: "新建自定义组", input: true, placeholder: "组名，如：白酒 / 新能源" },
    async name => {
      if (!name) return;
      const r = await fetch("/api/custom/groups", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      const d = await r.json();
      $("statusMsg").textContent = d.msg || "已新建组";
      if (d.ok && afterCode) {
        addStockToGroup(afterCode, d.id);   // 右键菜单里“新建组”直接带着这只股票入组
        return;
      }
      if (d.ok) { await loadGroups(); setView("group:" + d.id); }
    });
}

async function renameGroup(gid, oldName) {
  showModal({ title: "重命名自定义组", input: true, value: oldName },
    async name => {
      if (!name || name === oldName) return;
      const r = await fetch(`/api/custom/groups/${gid}/rename`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      const d = await r.json();
      $("statusMsg").textContent = d.msg || "已改名";
      if (d.ok) await loadGroups();
    });
}

async function removeGroup(gid) {
  const g = customGroups.find(x => x.id === gid);
  showModal({
    title: "删除自定义组", okText: "删除",
    msg: `确定删除「${g ? g.name : gid}」吗？\n组内股票在其他列表中的状态不受影响。`,
  }, async ok => {
    if (!ok) return;
    const r = await fetch(`/api/custom/groups/${gid}`, { method: "DELETE" });
    const d = await r.json();
    $("statusMsg").textContent = d.msg || "组已删除";
    if (viewMode === "group:" + gid) setView("all");
    await loadGroups();
  });
}

async function addStockToGroup(code, gid) {
  const r = await fetch(`/api/custom/groups/${gid}/stocks`, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
  const d = await r.json();
  $("statusMsg").textContent = d.msg || "已加入";
  if (d.ok) await loadGroups();
}

async function removeGroupStock(gid, code) {
  const r = await fetch(`/api/custom/groups/${gid}/stocks/${code}`, { method: "DELETE" });
  const d = await r.json();
  $("statusMsg").textContent = d.msg || "已移出";
  await loadGroups();
}

// ------------------------- 右键菜单 -------------------------

function hideCtxMenu() {
  $("ctxMenu").style.display = "none";
}

// ------------------------- 内联弹窗（建组/改名/删除确认） -------------------------
// prompt/confirm 在沙盒 iframe 里会被浏览器静默禁用（点击“＋”无反应），
// 所以用页面自绘弹窗替代，任意环境都可用

let _modalCb = null;

function showModal(opts, cb) {
  // opts: {title, msg, input=false, value='', placeholder='', okText='确定'}
  // cb(value)：输入弹窗回传输入值（取消回传 null）；确认弹窗回传 true/false
  _modalCb = cb;
  $("modalTitle").textContent = opts.title || "";
  $("modalMsg").textContent = opts.msg || "";
  $("modalMsg").style.display = opts.msg ? "" : "none";
  const input = $("modalInput");
  if (opts.input) {
    input.style.display = "";
    input.value = opts.value || "";
    input.placeholder = opts.placeholder || "";
    input.focus();
  } else {
    input.style.display = "none";
  }
  $("modalOk").textContent = opts.okText || "确定";
  $("modalMask").style.display = "flex";
}

function closeModal(value) {
  $("modalMask").style.display = "none";
  const cb = _modalCb;
  _modalCb = null;
  if (cb) cb(value);
}

function _modalInputVisible() {
  return $("modalInput").style.display !== "none";
}

$("modalOk").onclick = () => closeModal(
  _modalInputVisible() ? $("modalInput").value.trim() : true);
$("modalCancel").onclick = () => closeModal(_modalInputVisible() ? null : false);
$("modalMask").addEventListener("click", e => {
  if (e.target === $("modalMask")) $("modalCancel").onclick();
});
$("modalInput").addEventListener("keydown", e => {
  if (e.key === "Enter") $("modalOk").onclick();
  else if (e.key === "Escape") $("modalCancel").onclick();
});

function _ctxItem(text, fn) {
  const item = document.createElement("div");
  item.className = "ctx-item";
  item.textContent = text;
  item.onclick = () => { hideCtxMenu(); fn(); };
  return item;
}

function showStockCtxMenu(x, y, code) {
  const menu = $("ctxMenu");
  menu.innerHTML = "";
  const title = document.createElement("div");
  title.className = "ctx-item";
  title.style.cursor = "default";
  title.textContent = `${code} → 加入组`;
  title.style.color = "var(--muted)";
  menu.appendChild(title);
  customGroups.forEach(g => {
    const inGroup = g.stocks.some(s => s.code === code);
    menu.appendChild(_ctxItem((inGroup ? "✓ " : "📁 ") + g.name,
      () => addStockToGroup(code, g.id)));
  });
  if (!customGroups.length) {
    const tip = document.createElement("div");
    tip.className = "ctx-item";
    tip.style.cursor = "default";
    tip.style.color = "var(--muted)";
    tip.textContent = "（还没有自定义组）";
    menu.appendChild(tip);
  }
  menu.appendChild(document.createElement("div")).className = "ctx-sep";
  menu.appendChild(_ctxItem("＋ 新建组并加入…", () => promptAddGroup(code)));
  menu.style.display = "block";
  menu.style.left = Math.min(x, window.innerWidth - 160) + "px";
  menu.style.top = Math.min(y, window.innerHeight - 160) + "px";
}

function showGroupCtxMenu(x, y, gid, name) {
  const menu = $("ctxMenu");
  menu.innerHTML = "";
  menu.appendChild(_ctxItem("✏️ 改名", () => renameGroup(gid, name)));
  menu.appendChild(_ctxItem("🗑 删除组", () => removeGroup(gid)));
  menu.style.display = "block";
  menu.style.left = Math.min(x, window.innerWidth - 160) + "px";
  menu.style.top = Math.min(y, window.innerHeight - 100) + "px";
}

async function toggleWatch(code) {
  if (watchSet.has(code)) {
    await fetch(`/api/watch/${code}`, { method: "DELETE" });
    watchSet.delete(code);
  } else {
    const r = await fetch("/api/watch", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    const d = await r.json();
    if (!d.ok) { $("statusMsg").textContent = d.msg || "加入自选失败"; return; }
    $("statusMsg").textContent = d.msg;
    watchSet.add(code);
  }
  refreshWatchCount();
  renderTable();
}

async function addWatch() {
  const code = $("addCode").value.trim();
  if (!code) return;
  $("statusMsg").textContent = `校验 ${code} …`;
  const r = await fetch("/api/watch", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
  const d = await r.json();
  $("statusMsg").textContent = d.msg || (d.ok ? "已加入自选" : "加入失败");
  if (d.ok) { $("addCode").value = ""; hideSuggest(); await loadWatch(); }
}

// ---------------------------------------------------------------------------
// 添加股票 & 工具
// ---------------------------------------------------------------------------
async function addStock() {
  const code = $("addCode").value.trim();
  if (!code) return;
  $("statusMsg").textContent = `校验 ${code} …`;
  const r = await fetch("/api/pool", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code }) });
  const d = await r.json();
  $("statusMsg").textContent = d.msg || "已请求添加";
  if (d.ok) { $("addCode").value = ""; hideSuggest(); }
}

// ---------------------------------------------------------------------------
// 搜索联想（代码/名称）
// ---------------------------------------------------------------------------
let suggestTimer = null, suggestIdx = -1, suggestItems = [];

function showSuggest(items) {
  suggestItems = items;
  const box = $("suggestBox");
  if (!items.length) {
    box.innerHTML = `<div class="s-empty">未找到匹配的股票，请检查代码或名称</div>`;
    box.style.display = "block";
    return;
  }
  box.innerHTML = "";
  items.forEach((it, i) => {
    const div = document.createElement("div");
    div.className = "s-item";
    div.innerHTML =
      `<span class="s-code">${it.code}</span><span>${it.name}</span>` +
      `<span class="s-src">${it.source === "local" ? "已关注" : "全市场"}</span>`;
    div.onclick = () => { $("addCode").value = it.code; hideSuggest(); };
    div.onmouseenter = () => { suggestIdx = i; renderSuggestActive(); };
    box.appendChild(div);
  });
  suggestIdx = 0;
  renderSuggestActive();
  box.style.display = "block";
}

function renderSuggestActive() {
  [...$("suggestBox").children].forEach((el, i) => {
    if (suggestItems[i]) el.className = "s-item" + (i === suggestIdx ? " on" : "");
  });
}

function hideSuggest() {
  $("suggestBox").style.display = "none";
  suggestItems = [];
  suggestIdx = -1;
}

async function doSearch() {
  const q = $("addCode").value.trim();
  if (!q) { hideSuggest(); return; }
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const d = await r.json();
    if ($("addCode").value.trim() === q) showSuggest(d.items || []);
  } catch (e) { hideSuggest(); }
}

$("addCode").addEventListener("input", () => {
  clearTimeout(suggestTimer);
  suggestIdx = -1;
  suggestTimer = setTimeout(doSearch, 250);
});
$("addCode").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") {
    e.preventDefault();
    suggestIdx = Math.min(suggestIdx + 1, suggestItems.length - 1);
    renderSuggestActive();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    suggestIdx = Math.max(suggestIdx - 1, -1);
    renderSuggestActive();
  } else if (e.key === "Enter") {
    if (suggestIdx >= 0 && suggestItems[suggestIdx]) {
      e.preventDefault();
      $("addCode").value = suggestItems[suggestIdx].code;
      hideSuggest();
    }
  } else if (e.key === "Escape") {
    hideSuggest();
  }
});
document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrap")) hideSuggest();
  if (!e.target.closest(".ctx-menu")) hideCtxMenu();
});

function fmt(v, n) { return (v == null || isNaN(v)) ? "--" : Number(v).toFixed(n); }
function timeStr(t) { if (!t) return "--"; const d = new Date(t * 1000); return d.toTimeString().slice(0, 8); }

// 排序点击（表头）
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  if (sortedKey === k) sortedDir = -sortedDir; else { sortedKey = k; sortedDir = Number(th.dataset.dir || -1); }
  renderTable();
});

// ---------------------------------------------------------------------------
// 可拖动分隔条（左侧宽度 / 底部面板高度）
// ---------------------------------------------------------------------------
function initSplitters() {
  const drag = (handle, onMove) => {
    handle.addEventListener("mousedown", e => {
      e.preventDefault();
      handle.classList.add("active");
      document.body.classList.add("dragging");
      const move = ev => onMove(ev);
      const up = () => {
        handle.classList.remove("active");
        document.body.classList.remove("dragging");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
        chart && chart.resize();
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  };
  const aside = document.querySelector("aside");
  drag($("vSplit"), ev => {
    const w = Math.min(Math.max(ev.clientX, 280), window.innerWidth * 0.7);
    aside.style.width = w + "px";
    chart && chart.resize();
  });
  const panel = document.querySelector(".signals-panel");
  drag($("hSplit"), ev => {
    const h = Math.min(Math.max(window.innerHeight - ev.clientY, 120), window.innerHeight * 0.7);
    panel.style.height = h + "px";
    chart && chart.resize();
  });
}

window.addEventListener("resize", () => chart && chart.resize());
initSplitters();
loadWatch();
connectWS();
